<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Funky Little Guys</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<style>
  :root{--bg:#1b1f3a;--panel:#262b52;--panel2:#30366a;--you:#3fa0ff;--foe:#ff4d5e;--gold:#ffc93c;--txt:#f3f4ff;--mut:#a9aed8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:linear-gradient(#a8dcff,#ffd9ec 55%,#fff1d6);background-attachment:fixed;color:var(--txt);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100%;user-select:none;-webkit-user-select:none}
  #app{max-width:460px;margin:0 auto;padding:8px}
  h1{font-size:20px;margin:2px 0 6px;text-align:center;letter-spacing:1px}
  h1 span{color:var(--gold)}
  #hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--panel);border-radius:12px;padding:6px 10px}
  .side{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
  .side.you{text-align:right}
  .hpbar{height:10px;background:#11142a;border-radius:6px;overflow:hidden}
  .hpbar div{height:100%;transition:width .4s}
  #ehp{background:var(--foe)} #php{background:var(--you);margin-left:auto}
  .side b{color:var(--txt)}
  #roundBox{text-align:center;font-size:13px;color:var(--mut)} #roundBox b{display:block;font-size:22px;color:var(--txt)}
  #stage{position:relative;margin-top:6px}
  canvas#cv{width:100%;display:block;border-radius:14px;touch-action:none;box-shadow:0 6px 24px #0008}
  #toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:#000c;padding:8px 14px;border-radius:10px;
    font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}
  #banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:#0008;border-radius:14px;text-align:center}
  #banner.hidden,#overlay.hidden{display:none}
  #banner h2{font-size:38px;margin:0;text-shadow:0 3px 0 #0008}
  #banner p{margin:0;color:var(--mut)}
  button{font-family:inherit;font-weight:bold;border:0;border-radius:10px;padding:9px 12px;font-size:14px;color:#fff;cursor:pointer;
    background:var(--panel2);box-shadow:0 3px 0 #0006}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #0006}
  button:disabled{opacity:.4;cursor:default}
  button.go{background:linear-gradient(#ff7a45,#e8452c)}
  button.big{font-size:18px;padding:12px 26px}
  #controls{display:flex;gap:6px;align-items:center;margin-top:8px}
  #goldBox{display:flex;align-items:center;gap:5px;background:var(--panel);padding:7px 10px;border-radius:10px;font-size:18px}
  .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 55%,#c98a00);display:inline-block}
  #capBox{font-size:12px;color:var(--mut);flex:1;text-align:center}
  #shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .card{background:var(--panel);border-radius:12px;padding:6px 4px;text-align:center;cursor:pointer;position:relative;border:2px solid transparent}
  .card:hover{border-color:#ffffff30}
  .card.cant{opacity:.45}
  .card canvas{width:64px;height:64px}
  .card .nm{font-size:12px;font-weight:bold}
  .card .rl{font-size:10px;color:var(--mut)}
  .card .cost{position:absolute;top:4px;left:5px;display:flex;align-items:center;gap:2px;font-weight:bold;font-size:13px}
  .card .up{position:absolute;top:3px;right:4px;font-size:10px;background:#3ddc84;color:#062;border-radius:6px;padding:1px 4px;font-weight:bold}
  .card.sold{visibility:hidden}
  #info{background:var(--panel);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:12px;color:var(--mut);min-height:52px}
  #info b{color:var(--txt);font-size:14px}
  #info .stats{margin-top:3px}
  #overlay{position:fixed;inset:0;background:transparent;display:flex;align-items:center;justify-content:center;z-index:10;padding:14px}
  #overlay{overflow-y:auto;align-items:flex-start} #overlay > *{margin:auto}
  .ovbox{max-width:440px;width:100%;text-align:center}
  body:has(#overlay:not(.hidden)) #app{visibility:hidden}
  #capBox{background:rgba(48,40,100,.75);color:#fff!important;border-radius:999px;padding:5px 8px}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
  .card-glass{background:rgba(48,40,100,.86);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(90,50,140,.35);border:2px solid rgba(255,255,255,.25);box-sizing:border-box}
  .ovbox h2{margin:4px 0}
  .ovbox p{color:var(--mut);font-size:14px}
  .heroes{display:grid;gap:10px;margin-top:12px}
  .hero{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:14px;padding:10px;cursor:pointer;text-align:left;border:2px solid transparent}
  .hero:hover{border-color:var(--gold)}
  .hero canvas{width:72px;height:72px;flex:none}
  .hero b{font-size:16px}
  .hero small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
  .help{font-size:12px;color:var(--mut);text-align:left;background:var(--panel);border-radius:12px;padding:8px 12px;margin-top:12px;line-height:1.5}

  #topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  #topbar h1{margin:0;text-shadow:0 2px 0 #6a3fa0,1.5px 0 0 #6a3fa0,-1.5px 0 0 #6a3fa0,0 -1.5px 0 #6a3fa0}
  #menuBtn{padding:6px 10px;font-size:13px}
  #modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
  #modal.hidden{display:none}
  .mbox{background:var(--panel);border-radius:18px;padding:20px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px #000a;border:2px solid #ffffff18}
  .mbox h2{margin:0 0 6px} .mbox p{color:var(--mut);margin:0 0 16px;font-size:14px}
  .mbox .row{display:flex;gap:10px;justify-content:center}
  .menu{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:440px;width:100%}
  .menu canvas{width:100%;border-radius:18px;box-shadow:0 8px 30px #0009}
  .logo{font-size:46px;font-weight:900;line-height:.95;text-align:center;letter-spacing:2px;margin-top:-4px;
    text-shadow:0 4px 0 #0007,0 0 24px #ffc93c55}
  .logo span{color:var(--gold);font-size:38px}
  .logo{text-shadow:0 4px 0 #6a3fa0,2px 0 0 #6a3fa0,-2px 0 0 #6a3fa0,0 -2px 0 #6a3fa0,0 8px 18px rgba(90,50,140,.45)!important}
  .tag{color:#fff;font-size:14px;margin-bottom:6px;background:rgba(90,60,150,.55);padding:4px 14px;border-radius:999px}
  .menu button{width:240px}
  .stats{font-size:12px;color:#fff;margin-top:4px;background:rgba(90,60,150,.55);padding:3px 12px;border-radius:999px}
  .back{position:absolute;left:14px;top:14px}
  .roster{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;max-height:70vh;overflow:auto;padding-right:4px}
  .rcard{background:var(--panel);border-radius:12px;padding:8px;text-align:left;display:flex;gap:8px;align-items:flex-start}
  .rcard canvas{width:54px;height:54px;flex:none}
  .rcard b{font-size:13px} .rcard small{display:block;font-size:11px;color:var(--mut);line-height:1.35}
  .rcard .rt{color:var(--gold);font-size:10px}
  .panel{max-width:440px;width:100%;text-align:left;position:relative;background:rgba(48,40,100,.88);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(90,50,140,.35);border:2px solid rgba(255,255,255,.25);box-sizing:border-box}
  .panel h2{text-align:center}
  .panel .help{font-size:14px;line-height:1.65}
  .dkprev{background:var(--panel);border-radius:14px;padding:8px 10px;width:300px;max-width:100%;cursor:pointer;border:2px solid #ffffff14}
  .dkprev:hover{border-color:var(--gold)}
  .dkname{font-weight:bold;font-size:14px;text-align:center} .dkname span{color:var(--mut);font-weight:normal;font-size:12px}
  .dkrow{display:flex;justify-content:center;align-items:flex-end;gap:0;margin-top:2px}
  .dktabs{display:flex;gap:6px;margin:6px 0 10px} .dktabs button{flex:1;padding:8px 4px;font-size:13px;background:var(--panel)}
  .dktabs button.on{background:var(--panel2);outline:2px solid var(--gold)} .dktabs .act{color:#3ddc84}
  .dkline{display:flex;align-items:center;gap:8px} .dkline label{color:var(--mut);font-size:13px}
  .dkline input{flex:1;background:#11142a;border:2px solid #ffffff22;border-radius:8px;color:#fff;font:inherit;padding:6px 8px}
  .panel h3{margin:12px 0 6px;font-size:15px} .panel h3 .cnt{color:var(--foe)} .panel h3 .cnt.ok{color:#3ddc84} .panel h3 .avg{color:var(--mut);font-weight:normal;font-size:12px;margin-left:6px}
  .dkheroes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .dkheroes .nm{font-size:9.5px!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dkminis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .dkcard{background:var(--panel);border-radius:12px;padding:4px 2px 6px;text-align:center;cursor:pointer;position:relative;border:2px solid transparent;opacity:.6}
  .dkcard.on{border-color:var(--gold);opacity:1;background:var(--panel2)}
  .dkcard canvas{display:block;margin:0 auto}
  .dkcard .nm{font-size:11px;font-weight:bold} .dkcard .rl{font-size:10px;color:var(--mut)}
  .dkcard .cost{position:absolute;top:4px;left:6px;display:flex;gap:2px;align-items:center;font-weight:bold;font-size:12px}
  .dkcard .chk{position:absolute;top:3px;right:5px;color:#3ddc84;font-weight:bold}
  .dkinfo{background:var(--panel);border-radius:12px;padding:8px 10px;margin-top:10px;font-size:12px;min-height:48px;line-height:1.45}
  .dkinfo small{display:block;font-size:11px}
  .dkact{display:flex;gap:8px;margin-top:10px} .dkact button{flex:1}
  .onl{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
  .onl .or{color:var(--mut);font-size:13px}
  .joinrow{display:flex;gap:8px} .joinrow input{width:130px;text-align:center;font:inherit;font-size:22px;font-weight:bold;letter-spacing:4px;background:#11142a;border:2px solid #ffffff33;border-radius:10px;color:#fff;padding:6px}
  .onstatus{text-align:center;font-size:14px;min-height:20px;line-height:1.5} .onstatus .bad{color:#ff9aa6}
  .bigcode{font-size:44px;font-weight:900;letter-spacing:8px;color:var(--gold);text-shadow:0 3px 0 #6a3fa0;margin:4px 0}
  .spin{color:var(--mut);animation:pulse 1.2s infinite} @keyframes pulse{50%{opacity:.4}}
  .dkpv{margin-top:10px;background:rgba(20,16,50,.5);border-radius:14px;padding:8px;border:2px solid rgba(255,230,140,.35)}
  .dkpv-empty{text-align:center;color:var(--mut);font-size:13px;padding:10px}
  .dkpv-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
  .dkpv-hint{font-size:12px;color:var(--gold);animation:pulse 1.6s infinite}
  .dkpv-cv{width:100%;border-radius:10px;display:block;touch-action:manipulation;cursor:pointer}
  .dkpv-sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:11px;color:#e8e6ff} .dkpv-sum .chip{background:rgba(255,255,255,.12);border-radius:999px;padding:2px 8px}
  .dkwarn{color:#ff9aa6;font-size:13px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div id="topbar"><h1>FUNKY <span>LITTLE GUYS</span></h1><button id="menuBtn">☰ Menu</button></div>
  <div id="hud">
    <div class="side enemy"><span>Rival <b id="ehpt">20</b></span><div class="hpbar"><div id="ehp" style="width:100%"></div></div></div>
    <div id="roundBox">Round<b id="round">1</b></div>
    <div class="side you"><span><b id="phpt">20</b> You</span><div class="hpbar"><div id="php" style="width:100%"></div></div></div>
  </div>
  <div id="stage">
    <canvas id="cv" width="440" height="660"></canvas>
    <div id="toast"></div>
    <div id="banner" class="hidden"></div>
  </div>
  <div id="controls">
    <div id="goldBox"><span class="coin"></span><b id="gold">0</b></div>
    <span id="capBox"></span>
    <button id="refresh">↻ Refresh <span class="coin" style="width:11px;height:11px"></span>1</button>
    <button id="sell" disabled>Sell</button>
    <button id="fight" class="go">⚔ Fight!</button>
  </div>
  <div id="shop"></div>
  <div id="info"></div>
</div>
<div id="overlay" class="hidden"></div>
<div id="modal" class="hidden"></div>

<script>
"use strict";
// ======================= DATA =======================
const TYPES = {
  shell:  {name:'Shellby', title:'Shell Knight', cost:2, hp:720, atk:38, range:30,  spd:50, cd:1.1, color:'#4fae6a', role:'Tank',     desc:'Reflects 25% of melee damage back at attackers.'},
  fox:    {name:'Ember',   title:'Flame Fox',    cost:2, hp:460, atk:52, range:30,  spd:85, cd:0.8, color:'#ff8a3d', role:'Fighter',  desc:'Each hit sets the target on fire for 3 seconds.'},
  golem:  {name:'Grum',    title:'Stone Golem',  cost:3, hp:950, atk:42, range:30,  spd:42, cd:1.25,color:'#8d8f99', role:'Tank',     desc:'Every 6s grows a stone shield worth 30% of max HP.'},
  owl:    {name:'Frosty',  title:'Frost Owl',    cost:3, hp:340, atk:46, range:210, spd:55, cd:1.1, color:'#8fd3ff', role:'Ranged',   desc:'Icy shots slow enemies by 40%.'},
  sprite: {name:'Bloom',   title:'Thorn Sprite', cost:3, hp:330, atk:24, range:180, spd:55, cd:1.2, color:'#7ee081', role:'Healer',   desc:'Every 3s heals the most injured ally.'},
  beetle: {name:'Zap',     title:'Volt Beetle',  cost:3, hp:380, atk:38, range:160, spd:60, cd:1.0, color:'#ffd93d', role:'Ranged',   desc:'Every 4s fires chain lightning that jumps to 3 enemies.'},
  cat:    {name:'Shade',   title:'Shadow Cat',   cost:4, hp:430, atk:68, range:30,  spd:95, cd:0.9, color:'#6b4fa8', role:'Assassin', desc:'Leaps behind the farthest enemy. Every 3rd hit crits for 2.5x.'},
  shroom: {name:'Boomcap', title:'Spore Bomber', cost:4, hp:360, atk:54, range:200, spd:50, cd:1.6, color:'#e2433f', role:'Splash',   desc:'Spore bombs damage all enemies near the target.'},
  nibs:   {name:'Nibs',    title:'Mouse Rogue',  cost:1, hp:300, atk:28, range:30,  spd:115,cd:0.6, color:'#a8a8b8', role:'Rogue',    desc:'Dodges 25% of attacks. If Nibs survives the round, you get +1 bonus gold.'},
  lulu:   {name:'Lulu',    title:'Bubble Medic', cost:3, hp:380, atk:30, range:185, spd:55, cd:1.15,color:'#ffa8cc', role:'Healer',   desc:'Throws healing bubbles at injured allies instead of attacking. Attacks enemies when everyone is healthy.'},
  rocco:  {name:'Rocco',   title:'Boulder Badger', cost:4, hp:540, atk:42, range:170, spd:55, cd:1.5, color:'#5a5a6a', role:'Bowler', desc:'Rolls a boulder that crashes through every enemy in a line, knocking them back.'},
  spindle:{name:'Spindle', title:'Weaver Spider', cost:4, hp:430, atk:34, range:150, spd:55, cd:1.1, color:'#4a2a6a', role:'Summoner', desc:'Web shots slow enemies. Every 6s hatches 2 Spiderlings (up to 3 at once).'},
  scorch: {name:'Scorch',  title:'Baby Dragon',  cost:4, hp:540, atk:40, range:110, spd:70, cd:1.0, color:'#3ccbb0', role:'Splash',   desc:'Breathes a cone of fire that hits every enemy in front of it and sets them burning.'},
  bruno:  {name:'Bruno',   title:'Keg Ogre',     cost:4, hp:1250,atk:40, range:30,  spd:45, cd:1.3, color:'#8aa860', role:'Tank',     desc:'Huge HP. When defeated, the powder keg on his back explodes, blasting and stunning nearby enemies.'},
  klank:  {name:'Klank',   title:'Clockwork Knight', cost:5, hp:1100, atk:88, range:30, spd:45, cd:1.8, color:'#c88a48', role:'Heavy', desc:'Slow but crushing hits. Each hit in a row on the same target deals +35% more damage.'},
  boar:   {name:'Tusk',    title:'Bramble Boar', cost:5, hp:900, atk:78, range:30,  spd:80, cd:1.3, color:'#9a6a43', role:'Bruiser',  desc:'Charges in fast. First hit deals 3x damage and stuns for 1.5s.'},
};
const HEROES = {
  coral:   {name:'Captain Coral', title:'Pirate Hero', hp:1050, atk:58, range:30,  spd:70, cd:1.0, color:'#e5566b', role:'Hero', energy:4,
            desc:'<b>Super:</b> all allies deal 2x damage for 6s.',
            promos:['Heals 20% HP every 4 attacks.', 'Once per round, when he would be knocked out he stays at 1 HP and becomes Invulnerable and Unstoppable for 4s.', 'Super replaced: heals 30% HP and deals 4x damage himself for 6s.']},
  willow:  {name:'Sage Willow',   title:'Forest Hero', hp:760,  atk:40, range:190, spd:55, cd:1.2, color:'#9b7be0', role:'Hero', energy:4,
            desc:'<b>Super:</b> she and her 3 nearest allies gain a magic shield (25% of their max HP).',
            promos:['Allies with her shield gain Rage (+40% attack speed, +30% move speed).', 'When one of her shields breaks, it blasts nearby enemies for damage.', 'When one of her shields breaks, she gains +10% attack damage (stacks up to 8 times).']},
  ironjaw: {name:'Ironjaw',       title:'Knight Hero', hp:1350, atk:48, range:30,  spd:55, cd:1.3, color:'#5f84b8', role:'Hero', energy:4,
            desc:'<b>Super:</b> swings his hammer in a full circle, knocking nearby enemies away, dealing damage and stunning them for 2s.',
            promos:['Isolated enemies (no ally nearby) take +30% damage from him, and each hit steals 2 of their energy.', 'Revives once per round with 40% HP. On revive he gains 150% HP Steal and Rage for 5s.', '<b>Boast:</b> every takedown summons a Skeleton Warrior. His Super deals +30% damage.']},
  kenji:   {name:'Kenji',         title:'Wind Fist Hero', hp:1000, atk:58, range:30, spd:88, cd:0.75, color:'#3a6fd8', role:'Hero', energy:4,
            desc:'<b>Super:</b> dashes in with a Palm Strike that deals massive damage (4.5x) to a single enemy.',
            promos:['<b>Clash:</b> starts every fight with full energy.', '<b>Boast:</b> every takedown gives +4 energy and heals 10% HP.', 'His Palm Strike pierces through every enemy in a line behind the target, but costs 6 energy instead of 4.']},
  nyx:     {name:'Lady Nyx',      title:'Moonlit Countess', hp:820, atk:44, range:190, spd:60, cd:1.1, color:'#8a2a52', role:'Hero', energy:4,
            desc:'<b>Ambush:</b> when the fight starts, she strikes the weakest enemy for heavy damage with 100% HP Steal, then is Unstoppable for 1s. <b>Super:</b> releases a swarm of 4 bats.',
            promos:['Attacks and Super deal +30% damage to injured enemies and apply Anti-Heal (-60% healing for 3s).', '<b>Boast:</b> every takedown gives +15% attack speed for the rest of the game (max +150%).', 'After Ambush and each Super, her attacks have 100% HP Steal for 2s.']},
  fern:    {name:'Fern',          title:'Wildwarden Hero', hp:820, atk:46, range:215, spd:60, cd:1.0, color:'#3f9a4a', role:'Hero', energy:4,
            desc:'<b>Super:</b> heals herself and the 4 nearest allies for 30% HP over 2s. Placed in the <b>front 2 rows</b> she fights in <b>Deer Form</b>: a melee bruiser with more HP and much more attack.',
            promos:['When her Super overheals an ally, that ally deals 2x damage for 6s.', 'When her Super overheals an ally, that ally also gains +1 energy.', 'Gains +15% attack damage and +15% attack speed every 5s during the fight.']},
  valka:   {name:'Valka',         title:'Bulwark Hero', hp:1450, atk:44, range:30, spd:60, cd:1.15, color:'#2f5fa8', role:'Hero', energy:4,
            desc:'<b>Super:</b> raises her shield for 6s, reflecting 40% of damage back at attackers and healing 30% HP over that time.',
            promos:['Gains +1 energy when stunned, and when a heal leaves her below full HP.', 'Her Super also taunts every enemy: they must attack her for 3s.', '<b>Clash:</b> when the fight starts, enemies in a zone in front of her deal almost no damage (-85%) for 7s.']},
};
const LV = [1, 1.75, 3];
const START_HP = 20;
const W = 520, H = 660;
const COLX = c => 110 + c * 100;  // board sits in the middle; the sides hold scenery
const BX0 = 60, BX1 = 460;        // board area left/right edges
const ROWS = 4;
const PY = [396, 464, 532, 600];   // player rows, front -> back
const EY = [304, 236, 168, 100];   // enemy rows,  front -> back
const defOf = u => u.hero ? HEROES[u.key] : u.summon ? SUMMONS[u.key] : TYPES[u.key];
const isRanged = d => d.range >= 100;
const capFor = r => Math.min(2 + r, 6);
const incomeFor = r => Math.min(3 + r, 9);
const heroLvl = r => r >= 7 ? 3 : r >= 4 ? 2 : 1;
const heroPromo = r => r >= 7 ? 3 : r >= 5 ? 2 : r >= 3 ? 1 : 0;

// ======================= PLANNING =======================

}

}

function startPlan() {
  S.phase = 'plan';
  S.sel = null;
  S.ents = []; S.projs = []; S.fx = []; S.floats = []; S.parts = []; S.corpses = [];
  allPlayerUnits().forEach(u => { if (u.hero) u.lvl = heroLvl(S.round); });
  S.gold += incomeFor(S.round);
  if (S.nibGold) { S.gold += S.nibGold; setTimeout(() => toast(`Nibs snuck back +${S.nibGold} gold!`), 300); S.nibGold = 0; }
  rollShop();

  $('banner').classList.add('hidden');
  updateHud(); renderShop(); renderInfo();
}

function buy(i) {
  if (S.phase !== 'plan' || (S.online && S.online.myReady)) return;
  const k = S.shop[i]; if (!k) return;
  const d = TYPES[k];
  if (S.gold < d.cost) return toast('Not enough gold');
  const owned = allPlayerUnits().filter(u => u.key === k && u.lvl < 3).sort((a, b) => b.lvl - a.lvl)[0];
  if (owned) {
    owned.lvl++; owned.spent += d.cost;
    toast(`${d.name} leveled up to ★${owned.lvl}!`);
    burstAtUnit(owned);
  } else {
    if (boardCount() >= capFor(S.round)) return toast(`Board is full (${capFor(S.round)} minis). Sell one first`);
    const rows = isRanged(d) ? [2, 3, 1, 0] : [0, 1, 2, 3];
    const cols = [1, 2, 0, 3];
    let placed = false;
    outer: for (const r of rows) for (const c of cols) if (!S.pgrid[r][c]) { S.pgrid[r][c] = mk(k); placed = true; break outer; }
    if (!placed) return toast('No free tile');

  S.gold -= d.cost;
  S.shop[i] = null;
  updateHud(); renderShop();
}

function burstAtUnit(u) {
  let pos = null;
  S.pgrid.forEach((r, ri) => r.forEach((x, c) => { if (x === u) pos = [COLX(c), PY[ri]]; }));
  if (pos) for (let i = 0; i < 18; i++) S.parts.push(part(pos[0], pos[1], '#ffd23f'));
}

function refresh() {
  if (S.phase !== 'plan') return;
  if (S.gold < 1) return toast('Not enough gold');
  S.gold -= 1; rollShop(); updateHud(); renderShop();
}

function getAt(h) {
  if (!h) return null;

}

}

  const u = getAt(S.sel);

  const val = Math.max(1, u.spent - 1);
  S.gold += val; setAt(S.sel, null);
  toast(`Sold ${TYPES[u.key].name} for ${val} gold`);
  S.sel = null; updateHud(); renderShop(); renderInfo();
}

  const a = getAt(from), b = getAt(to);
  setAt(to, a); setAt(from, b);
  S.sel = to; renderInfo(); updateHud();
}

    if (Math.abs(x - cx) > 48) continue;
    for (let r = 0; r < ROWS; r++) {
      if (Math.abs(y - PY[r]) < 34) return { zone: 'board', r, c };
      if (Math.abs(y - EY[r]) < 34) return { zone: 'enemy', r, c };

}

// ======================= AI =======================
function aiPlan() {
  const ai = S.ai;
  ai.gold += incomeFor(S.round) + (S.round >= 4 ? 1 : 0) + (ai.nibGold || 0); ai.nibGold = 0;
  const cap = capFor(S.round);
  const pool = deckPool(ai.deck);
  for (let pass = 0; pass < 4; pass++) {
    const shop = [0, 1, 2, 3].map(() => rnd(pool));
    shop.sort((a, b) => {
      const ua = ai.units.some(u => u.key === a && u.lvl < 3) ? 1 : 0, ub = ai.units.some(u => u.key === b && u.lvl < 3) ? 1 : 0;
      return (ub - ua) || (TYPES[b].cost - TYPES[a].cost);
    });
    for (const k of shop) {
      const cost = TYPES[k].cost;
      if (ai.gold < cost) continue;
      const own = ai.units.find(u => u.key === k && u.lvl < 3);
      if (own) { own.lvl++; ai.gold -= cost; }
      else if (ai.units.length < cap) { ai.units.push(mk(k)); ai.gold -= cost; }
    }
    if (ai.gold < 3 || pass === 3) break;
    ai.gold -= 1; // AI pays for its refresh
  }
  // keep a balanced team: make sure there's at least one front-liner
  // layout
  const hero = ai.heroUnit && ai.heroUnit.key === ai.hero ? ai.heroUnit : (ai.heroUnit = mk(ai.hero, true)); hero.lvl = heroLvl(S.round);
  const all = [hero, ...ai.units];
  const front = all.filter(u => !isRanged(defOf(u))).sort((a, b) => defOf(b).hp * LV[b.lvl - 1] - defOf(a).hp * LV[a.lvl - 1]);
  const back = all.filter(u => isRanged(defOf(u)));
  S.egrid = emptyGrid();
  const cols = [1, 2, 0, 3];
  const put = (u, order) => {
    for (const r of order) for (const c of cols) if (!S.egrid[r][c]) { S.egrid[r][c] = u; return; }
  };
  // mix it up a little so the rival isn't always identical
  const fo = Math.random() < 0.5 ? [0, 1, 2, 3] : [1, 0, 2, 3], bo = Math.random() < 0.5 ? [2, 3, 1, 0] : [3, 2, 1, 0];
  front.forEach(u => put(u, fo));
  back.forEach(u => put(u, bo));
}

function drawProjectiles(now) {

function drawFx(dt) {
  for (const f of S.fx) {
    f.t -= dt; const k = 1 - f.t / f.dur;
    if (f.kind === 'ring') { const ek = 1 - (1 - k) * (1 - k); ctx.globalAlpha = Math.max(0, 1 - k); circle(ctx, f.x, f.y, f.maxR * ek, null, f.col, 7 * (1 - k) + 1.5); ctx.globalAlpha = 1; }

      ctx.strokeStyle = f.col; ctx.globalAlpha = f.t / f.dur; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(f.a.x, f.a.y); ctx.quadraticCurveTo((f.a.x + f.b.x) / 2, Math.min(f.a.y, f.b.y) - 40, f.b.x, f.b.y); ctx.stroke(); ctx.globalAlpha = 1;
    }

      for (const [lw, col] of [[7, 'rgba(255,230,80,.35)'], [2.5, '#fffbd0']]) {
        ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.globalAlpha = f.t / f.dur; ctx.beginPath();
        for (let i = 0; i < f.pts.length - 1; i++) {
          const [x1, y1] = f.pts[i], [x2, y2] = f.pts[i + 1]; ctx.moveTo(x1, y1);
          for (let s = 1; s <= 5; s++) { const q = s / 5; ctx.lineTo(x1 + (x2 - x1) * q + (s < 5 ? (Math.random() - 0.5) * 18 : 0), y1 + (y2 - y1) * q + (s < 5 ? (Math.random() - 0.5) * 18 : 0)); }
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    if (f.kind === 'slash') {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ang + (f.flip ? Math.PI / 2 : -Math.PI / 2));
      ctx.globalAlpha = Math.max(0, 1 - k);
      const a0 = -1.2 + k * 0.6, a1 = 1.2 * Math.min(1, k * 3);
      ctx.beginPath(); ctx.arc(0, 0, 32, a0, a1); ctx.strokeStyle = f.col; ctx.lineWidth = 10 * (1 - k) + 1; ctx.lineCap = 'round'; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 32, a0, a1); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5 * (1 - k); ctx.stroke();
      ctx.globalAlpha *= 0.5; ctx.beginPath(); ctx.arc(0, 0, 22, a0 + 0.3, a1 - 0.2); ctx.strokeStyle = f.col; ctx.lineWidth = 4 * (1 - k); ctx.stroke();

    if (f.kind === 'spark') {
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = f.col; ctx.lineWidth = f.big ? 4.5 : 3;
      const r1 = (f.big ? 12 : 6) + k * (f.big ? 32 : 18), r2 = r1 + (f.big ? 16 : 9) * (1 - k);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + 0.3; ctx.moveTo(f.x + Math.cos(a) * r1, f.y + Math.sin(a) * r1); ctx.lineTo(f.x + Math.cos(a) * r2, f.y + Math.sin(a) * r2); }
      ctx.stroke();
      if (k < 0.4) circle(ctx, f.x, f.y, (f.big ? 16 : 9) * (1 - k), '#ffffffcc');

    }
    if (f.kind === 'spin') {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(k * Math.PI * 2.2); ctx.globalAlpha = Math.max(0, 1 - k);
      ctx.strokeStyle = '#e6ecff'; ctx.lineWidth = 9 * (1 - k) + 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, 70, 0, Math.PI * 1.3); ctx.stroke(); ctx.strokeStyle = '#ffd36b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 80, 0, Math.PI * 1.1); ctx.stroke();

    }
    if (f.kind === 'line') {

  for (const p of S.parts) {
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;

  }
  ctx.globalAlpha = 1;
  S.parts = S.parts.filter(p => p.t > 0);
  ctx.textAlign = 'center';
  for (const f of S.floats) {
    f.t -= dt; f.y -= 34 * dt;

}

const DPR = Math.min(3, Math.max(2, window.devicePixelRatio || 1));
cv.width = W * DPR; cv.height = H * DPR;
let last = performance.now(), acc = 0;
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S) {
    const sdt = S.paused ? 0 : rdt * (S.phase === 'battle' ? S.speed : 1);
    if (hitStopT > 0) hitStopT -= rdt;
    else if (S.phase === 'battle' && S.online && !S.online.host) { guestSmooth(rdt); }
    else if (S.phase === 'battle' && !S.paused) {
      acc += sdt;
      while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; if (S.online && S.online.host && ++S.online.tick % 2 === 0) hostSnapshot(); }
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.save();
    if (shakeAmt > 0) { ctx.translate((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt); shakeAmt = Math.max(0, shakeAmt - rdt * 40); }
    drawField();
    if (S.phase === 'plan' || S.phase === 'hero') { drawTiles(); drawPlanUnits(); }
    else { drawBattle(sdt); }
    drawFx(hitStopT > 0 ? 0 : sdt);
    ctx.restore();
    if (S.flashT > 0) { S.flashT -= rdt; ctx.fillStyle = `rgba(255,255,255,${Math.max(0, S.flashT) * 1.4})`; ctx.fillRect(0, 0, W, H); }
  }
  requestAnimationFrame(frame);
}


// ======================= DECKS =======================
const DECK_SIZE = 6;
const DEFAULT_DECKS = [
  { name: 'Deck 1', hero: 'coral', minis: ['shell', 'fox', 'golem', 'owl', 'sprite', 'beetle'] },
  { name: 'Deck 2', hero: 'willow', minis: ['golem', 'sprite', 'owl', 'shroom', 'cat', 'fox'] },
  { name: 'Deck 3', hero: 'ironjaw', minis: ['shell', 'boar', 'cat', 'beetle', 'shroom', 'fox'] },
];
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function loadDecks() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem('pb_decks')); } catch (e) {}
  if (!d || !Array.isArray(d.decks) || d.decks.length !== 3) d = { active: 0, decks: JSON.parse(JSON.stringify(DEFAULT_DECKS)) };
  d.decks.forEach((dk, i) => {
    if (!HEROES[dk.hero]) dk.hero = DEFAULT_DECKS[i].hero;
    dk.minis = (dk.minis || []).filter((k, j, a) => TYPES[k] && a.indexOf(k) === j).slice(0, DECK_SIZE);
    if (typeof dk.name !== 'string' || !dk.name.trim()) dk.name = 'Deck ' + (i + 1);
  });
  if (!(d.active >= 0 && d.active < 3)) d.active = 0;
  return d;
}
let DECKS = loadDecks();
function saveDecks() { try { localStorage.setItem('pb_decks', JSON.stringify(DECKS)); } catch (e) {} }
function activeDeck() {
  const dk = DECKS.decks[DECKS.active];
  return dk.minis.length === DECK_SIZE ? dk : (DECKS.decks.find(d => d.minis.length === DECK_SIZE) || DEFAULT_DECKS[0]);
}
function cardCanvas(key, px, hero) {
  const c = document.createElement('canvas'); c.width = px * 2; c.height = px * 2;
  c.style.width = px + 'px'; c.style.height = px + 'px';
  const g = c.getContext('2d'); g.scale(2, 2);
  drawMini(g, key, px / 2, px * (hero ? 0.56 : 0.47), px * (hero ? 0.32 : 0.33), null, 0, { still: true });
  return c;
}

let deckEdit = 0, deckInfoKey = null;
function showDecks() {
  stopMenuAnim();
  deckEdit = DECKS.active;
  renderDecks();
}
function renderDecks() {
  const p = panelShell('Decks');
  const dk = DECKS.decks[deckEdit];
  // tabs
  const tabs = document.createElement('div'); tabs.className = 'dktabs';
  DECKS.decks.forEach((d, i) => {
    const b = document.createElement('button');
    b.innerHTML = esc(d.name) + (i === DECKS.active ? ' <span class="act">✔</span>' : '');
    if (i === deckEdit) b.className = 'on';
    b.onclick = () => { deckEdit = i; deckInfoKey = null; renderDecks(); };
    tabs.appendChild(b);
  });
  p.appendChild(tabs);

  nm.innerHTML = `<label>Name</label>`;
  const inp = document.createElement('input'); inp.value = dk.name; inp.maxLength = 16;
  inp.oninput = () => { dk.name = inp.value.trim() || 'Deck ' + (deckEdit + 1); saveDecks(); tabs.children[deckEdit].innerHTML = esc(dk.name) + (deckEdit === DECKS.active ? ' <span class="act">✔</span>' : ''); };
  nm.appendChild(inp); p.appendChild(nm);
  p.appendChild(buildDeckPreview(dk));

  p.insertAdjacentHTML('beforeend', `<h3>Hero</h3>`);

    const el = document.createElement('div'); el.className = 'dkcard' + (dk.hero === k ? ' on' : '');
    el.appendChild(cardCanvas(k, 42, true));
    el.insertAdjacentHTML('beforeend', `<div class="nm">${HEROES[k].name.replace('Captain ', '').replace('Sage ', '').replace('Lady ', '')}</div>`);
    el.onclick = () => { dk.hero = k; deckInfoKey = k; saveDecks(); renderDecks(); };
    hg.appendChild(el);
  }
  p.appendChild(hg);
  // minis picker
  const avg = dk.minis.length ? (dk.minis.reduce((a, k) => a + TYPES[k].cost, 0) / dk.minis.length).toFixed(1) : '-';
  p.insertAdjacentHTML('beforeend', `<h3>Minis <span class="cnt ${dk.minis.length === DECK_SIZE ? 'ok' : ''}">${dk.minis.length}/${DECK_SIZE}</span> <span class="avg">Avg cost ${avg}</span></h3>`);
  const mg = document.createElement('div'); mg.className = 'dkminis';
  for (const k in TYPES) {
    const d = TYPES[k], on = dk.minis.includes(k);
    const el = document.createElement('div'); el.className = 'dkcard' + (on ? ' on' : '');
    el.appendChild(cardCanvas(k, 56));
    el.insertAdjacentHTML('beforeend', `<div class="cost"><span class="coin" style="width:11px;height:11px"></span>${d.cost}</div>${on ? '<div class="chk">✔</div>' : ''}
      <div class="nm">${d.name}</div><div class="rl">${d.role}</div>`);
    el.onclick = () => {
      deckInfoKey = k;
      if (on) dk.minis = dk.minis.filter(x => x !== k);
      else if (dk.minis.length >= DECK_SIZE) { showDeckMsg(`A deck holds ${DECK_SIZE} minis. Remove one first.`); renderDeckInfo(); return; }
      else dk.minis.push(k);
      saveDecks(); renderDecks();
    };
    mg.appendChild(el);
  }
  p.appendChild(mg);
  const info = document.createElement('div'); info.id = 'dkinfo'; info.className = 'dkinfo'; p.appendChild(info);
  renderDeckInfo();
  // actions
  const act = document.createElement('div'); act.className = 'dkact';
  const use = document.createElement('button'); use.className = 'go';
  const valid = dk.minis.length === DECK_SIZE;
  use.textContent = deckEdit === DECKS.active ? '✔ Active deck' : 'Use this deck';
  use.disabled = !valid || deckEdit === DECKS.active;
  use.onclick = () => { DECKS.active = deckEdit; saveDecks(); renderDecks(); };
  const play = document.createElement('button'); play.className = 'go'; play.textContent = '▶ Play with it';
  play.disabled = !valid;
  play.onclick = () => { DECKS.active = deckEdit; saveDecks(); newGame(); };
  act.appendChild(use); act.appendChild(play);
  p.appendChild(act);
  if (!valid) p.insertAdjacentHTML('beforeend', `<div class="dkwarn">Pick ${DECK_SIZE - dk.minis.length} more mini${DECK_SIZE - dk.minis.length === 1 ? '' : 's'} to finish this deck.</div>`);
}

function buildDeckPreview(dk) {

function startDeckPreview(c, dk) {

const NET_VERSION = 1;
const qp = new URLSearchParams(location.search);
const PEER_OPTS = qp.get('peerhost') ? { host: qp.get('peerhost').split(':')[0], port: +(qp.get('peerhost').split(':')[1] || 9000), path: '/', secure: false } : {};

// ---- Relay (TURN) settings: paste your free Metered "Open Relay" app name + API key here ----
// Sign up at https://dashboard.metered.ca/signup, create an app, then copy these two values.
const TURN_APP = '';   // e.g. 'funkylittleguys'  (the part before .metered.live)
const TURN_KEY = '';   // your API key
let iceCache = null;
async function iceServers() {
  if (iceCache) return iceCache;
  const list = [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    { urls: 'stun:stun.cloudflare.com:3478' },
  ];
  const app = qp.get('turnapp') || TURN_APP, key = qp.get('turnkey') || TURN_KEY;
  if (app && key) {
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 6000);
      const r = await fetch(`https://${app}.metered.live/api/v1/turn/credentials?apiKey=${encodeURIComponent(key)}`, { signal: ctl.signal });
      clearTimeout(to);
      if (r.ok) { const extra = await r.json(); if (Array.isArray(extra)) list.push(...extra); }
    } catch (e) { console.warn('TURN credentials unavailable', e); }
  }
  return (iceCache = list);
}
const hasRelay = () => !!((qp.get('turnapp') || TURN_APP) && (qp.get('turnkey') || TURN_KEY));
function watchIce(conn, onFail) {
  let tries = 0;
  const iv = setInterval(() => {
    const pc = conn.peerConnection;
    if (!pc) { if (++tries > 40) clearInterval(iv); return; }
    const st = pc.iceConnectionState;
    if (st === 'connected' || st === 'completed' || conn.open) { clearInterval(iv); return; }
    if (st === 'failed') { clearInterval(iv); onFail(); }
  }, 500);
}
const BLOCKED_MSG = () => hasRelay()
  ? '<span class="bad">Your networks blocked the connection, even through the relay. Try switching one of you to mobile data.</span>'
  : '<span class="bad">Found the room, but your networks blocked a direct connection.<br>Try switching one of you to mobile data, or add a free relay server (see the README).</span>';
const MIRROR = 700; // y-mirror line between the two boards (PY[r] + EY[r] = 700)

function netSend(m) { try { if (NET && NET.conn && NET.conn.open) NET.conn.send(m); } catch (e) {} }
function netClose() {
  const n = NET; NET = null;
  if (n) { try { if (n.conn && n.conn.open) n.conn.send({ t: 'bye' }); } catch (e) {} setTimeout(() => { try { n.conn && n.conn.close(); } catch (e) {} try { n.peer && n.peer.destroy(); } catch (e) {} }, 150); }
  if (S) S.online = null;
}
function roomCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (let i = 0; i < 5; i++) c += a[Math.floor(Math.random() * a.length)]; return c; }

function showOnline() {
  const p = panelShell('Play Online');

function onStatus(html) { const el = $('onStatus'); if (el) el.innerHTML = html; }
function peerReady() {
  if (typeof Peer === 'undefined') { onStatus('<span class="bad">Online play couldn\'t load. Check your internet connection and reload the page.</span>'); return false; }
  return true;
}
async function hostGame() {
  if (!peerReady()) return;
  netClose();
  const code = roomCode();
  onStatus('Creating room…');
  const peer = new Peer('flg-' + code, { ...PEER_OPTS, config: { iceServers: await iceServers() } });
  NET = { peer, conn: null, host: true };
  peer.on('open', () => {
    onStatus(`<div>Your room code</div><div class="bigcode">${code}</div><div>Tell your friend to tap <b>Join</b> and type this code.</div><div class="spin">Waiting for your friend…</div>
      <button id="onCancel" style="margin-top:8px">Cancel</button>`);
    $('onCancel').onclick = () => { netClose(); showOnline(); };
  });
  peer.on('connection', conn => {
    if (NET.conn && NET.conn.open) { conn.on('open', () => { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 200); }); return; }
    if (NET.conn) { try { NET.conn.close(); } catch (e) {} }   // an earlier attempt that never connected
    NET.conn = conn; wireConn(conn);
    watchIce(conn, () => { if (NET && NET.conn === conn) { NET.conn = null; onStatus(`<div>Your room code</div><div class="bigcode">${code}</div><span class="bad">Your friend found the room but the connection was blocked. They can try again, or switch to mobile data.</span>`); } });
  });

    if (err.type === 'unavailable-id') { netClose(); hostGame(); return; }

async function joinGame(code) {
  code = (code || '').toUpperCase().trim();
  if (code.length !== 5) { onStatus('<span class="bad">Enter the 5-letter code from your friend.</span>'); return; }
  if (!peerReady()) return;
  netClose();
  onStatus('Connecting…');
  const peer = new Peer({ ...PEER_OPTS, config: { iceServers: await iceServers() } });
  NET = { peer, conn: null, host: false };
  peer.on('open', () => {
    onStatus('Found the server, connecting to your friend…');
    const conn = peer.connect('flg-' + code, { reliable: true });
    NET.conn = conn; wireConn(conn);
    watchIce(conn, () => { if (NET && NET.conn === conn) onStatus(BLOCKED_MSG()); });
    setTimeout(() => { if (NET && NET.conn === conn && !conn.open) onStatus('Still trying… (this can take a little while on some networks)'); }, 9000);
    setTimeout(() => { if (NET && NET.conn === conn && !conn.open) onStatus(BLOCKED_MSG()); }, 25000);
  });
  peer.on('error', err => {
    onStatus(`<span class="bad">${err.type === 'peer-unavailable' ? 'No game found with that code.' : 'Connection problem (' + esc(err.type || 'error') + ').'}</span>`);

}
function wireConn(conn) {
  conn.on('open', () => {
    if (!NET.host) { conn.send({ t: 'hello', v: NET_VERSION }); onStatus('Connected! Starting…'); }
  });
  conn.on('data', m => { try { onNet(m); } catch (e) { console.error(e); } });
  conn.on('close', () => { if (NET && NET.conn === conn) lostConnection(); });
  conn.on('error', () => {});
}

function grabNew(arr, ser) { const out = []; for (const it of arr) if (!it._sent) { it._sent = 1; out.push(ser ? ser(it) : it); } return out; }
function hostSnapshot() {
  const e = S.ents.filter(x => x.alive).map(x => { const o = { h: x.u.hero ? 1 : 0 }; for (const [k, sk] of EF) o[sk] = rn(x[k]); return o; });
  const p = S.projs.map(q => ({ id: q.id || (q.id = entIdc++), x: rn(q.x), y: rn(q.y), h: rn(q.h || 0), k: q.kind, c: q.col, b: q.big ? 1 : 0, l: q.lob ? 1 : 0, a: rn(q.ang || 0), sp: rn(q.spin || 0) }));
  netSend({ t: 'snap', bt: rn(S.bt), sh: rn(shakeAmt), fl: rn(S.flashT || 0), e, p,
    fx: grabNew(S.fx, serFx), fl2: grabNew(S.floats, f => ({ x: rn(f.x), y: rn(f.y), txt: f.txt, col: f.col, t: f.t, big: f.big })),
    pa: grabNew(S.parts, q => [rn(q.x), rn(q.y), rn(q.vx), rn(q.vy), rn(q.t), q.col, rn(q.s)]),
    co: grabNew(S.corpses, c => ({ key: c.key, x: rn(c.x), y: rn(c.y), r: c.r, face: c.face, t: c.t })) });
}

// --- guest: render the host's battle, mirrored so you're always at the bottom ---
function guestStartBattle(round) {
  S.round = round;
  S.phase = 'battle'; S.sel = null; S.drag = null; S.speed = 1;
  S.ents = []; S.projs = []; S.fx = []; S.floats = []; S.corpses = []; S.parts = []; S.bt = 0;
  S.gmap = new Map(); S.ptrail = new Map();
  updateHud(); renderShop(); renderInfo();
}
function guestSnap(m) {
  if (S.phase !== 'battle') return;
  S.bt = m.bt; shakeAmt = Math.max(shakeAmt, m.sh); if (m.fl > (S.flashT || 0)) S.flashT = m.fl;
  const seen = new Set();
  for (const a of m.e) {
    let e = S.gmap.get(a.id);
    const fresh = !e;
    if (fresh) { e = { u: { hero: !!a.h, key: a.k }, alive: true, d: {} }; S.gmap.set(a.id, e); S.ents.push(e); }
    for (const [k, sk] of EF) e[k] = a[sk];
    e.side = -a.s; e.ky = -a.ky; e.ly = -a.ly;
    e.tx = a.x; e.ty = MIRROR - a.y;
    if (fresh) { e.x = e.px = e.tx; e.y = e.py = e.ty; } else { e.x = e.px; e.y = e.py; }
    e.alive = true; seen.add(a.id);
  }
  for (const [id, e] of S.gmap) if (!seen.has(id)) { e.alive = false; S.gmap.delete(id); }
  S.ents = S.ents.filter(e => e.alive);
  const trails = new Map();
  S.projs = m.p.map(q => {
    const tr = S.ptrail.get(q.id) || []; const y = MIRROR - q.y;
    tr.push([q.x, y - q.h]); if (tr.length > 12) tr.shift(); trails.set(q.id, tr);
    return { x: q.x, y, h: q.h, kind: q.k, col: q.c, big: !!q.b, lob: !!q.l, ang: -q.a, spin: q.sp, trail: tr };
  });
  S.ptrail = trails;
  for (const f of m.fx) {
    if ('y' in f) f.y = MIRROR - f.y;
    if ('y1' in f) { f.y1 = MIRROR - f.y1; f.y2 = MIRROR - f.y2; }
    if (f.pts) f.pts = f.pts.map(([x, y]) => [x, MIRROR - y]);
    if (f.kind === 'slash') { f.ang = -f.ang; }
    if (f.kind === 'beam') { f.a = S.gmap.get(f.a); f.b = S.gmap.get(f.b); if (!f.a || !f.b) continue; }
    S.fx.push(f);
  }
  for (const f of m.fl2) { f.y = MIRROR - f.y; S.floats.push(f); }
  for (const [x, y, vx, vy, t, col, sz] of m.pa) S.parts.push({ x, y: MIRROR - y, vx, vy, t, col, s: sz });
  for (const c of m.co) { c.y = MIRROR - c.y; S.corpses.push(c); }
}
function guestSmooth(dt) {
  const k = Math.min(1, dt * 18);
  for (const e of S.ents) { if (e.tx === undefined) continue; e.x += (e.tx - e.x) * k; e.y += (e.ty - e.y) * k; e.px = e.x; e.py = e.y; }
}
function guestResult(m) {
  if (!S.online) return;
  const res = m.res === 'win' ? 'lose' : m.res === 'lose' ? 'win' : 'draw';
  S.php = m.ehp; S.ehp = m.php;
  S.nibGold = m.nib || 0;
  allPlayerUnits().forEach(u => { if (u.hero && m.boasts && m.boasts[u.uid] !== undefined) u.boast = m.boasts[u.uid]; });
  let dmgTxt;
  if (res === 'win') dmgTxt = `Your friend loses ${1 + m.eAlive} HP`;
  else if (res === 'lose') dmgTxt = `You lose ${1 + m.pAlive} HP`;
  else dmgTxt = 'Both sides lose 1 HP';
  S.gmap = new Map();
  showResultBanner(res, dmgTxt, m.mvp);
}

function onNet(m) {
  if (!m || !m.t) return;
  switch (m.t) {
    case 'hello':
      if (!NET.host) return;
      if (m.v !== NET_VERSION) { netSend({ t: 'version' }); return; }
      netSend({ t: 'start' }); newOnlineGame(true); break;
    case 'start': newOnlineGame(false); break;
    case 'version': onStatus('<span class="bad">You and your friend have different versions of the game. Both reload the page.</span>'); break;
    case 'full': onStatus('<span class="bad">That room already has two players.</span>'); break;
    case 'ready':
      if (!S || !S.online) return;
      S.online.oppReady = true; S.online.oppBoard = m.board;
      if (!S.online.myReady) toast('Your friend is ready!');
      maybeStartOnlineBattle(); updateHud(); break;
    case 'battle': if (S && S.online) guestStartBattle(m.round); break;
    case 'snap': if (S && S.online) guestSnap(m); break;
    case 'result': guestResult(m); break;
    case 'bye': lostConnection(); break;
  }
}

// ======================= MENU / QUIT =======================
function loadStats() { try { return JSON.parse(localStorage.getItem('pb_stats')) || { w: 0, l: 0, d: 0 }; } catch (e) { return { w: 0, l: 0, d: 0 }; } }
function recordResult(r) { const st = loadStats(); st[r] = (st[r] || 0) + 1; try { localStorage.setItem('pb_stats', JSON.stringify(st)); } catch (e) {} }

let menuAnim = null;
function showMenu() {
  closeModal();
  if (S && S.online) netClose();
  if (S) { S.paused = true; S.phase = 'menu'; }
  $('banner').classList.add('hidden');
  const ov = $('overlay'); ov.innerHTML = '';
  const m = document.createElement('div'); m.className = 'menu';
  const mc = document.createElement('canvas'); mc.width = 880; mc.height = 480;

  m.insertAdjacentHTML('beforeend', `<div class="logo">FUNKY<br><span>LITTLE GUYS</span></div>
    <div class="tag">Build a squad. Watch it brawl.</div>`);

  const dk = activeDeck();
  const prev = document.createElement('div'); prev.className = 'dkprev';

  ov.classList.remove('hidden');

}
function stopMenuAnim() { if (menuAnim) cancelAnimationFrame(menuAnim); menuAnim = null; }
function startMenuAnim(mc) {
  stopMenuAnim();
  const g = mc.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0);
  const MW = 440, MH = 240;
  const parade = ['shell', 'fox', 'golem', 'owl', 'sprite', 'beetle', 'cat', 'shroom', 'boar'];
  const t0 = performance.now();
  const loop = now => {
    if (!mc.isConnected) { menuAnim = null; return; }
    const t = (now - t0) / 1000;
    const sky = g.createLinearGradient(0, 0, 0, MH); sky.addColorStop(0, '#6fc3ff'); sky.addColorStop(0.55, '#bfe8ff'); sky.addColorStop(0.56, '#6cb45c'); sky.addColorStop(1, '#4f8a4a');
    g.fillStyle = sky; g.fillRect(0, 0, MW, MH);
    // sun & clouds
    circle(g, 370, 40, 22, '#fff3b0'); circle(g, 370, 40, 32, 'rgba(255,243,176,.3)');
    for (let i = 0; i < 4; i++) { const cx = ((i * 140 + t * 12) % 560) - 60, cy = 30 + (i % 2) * 22; ell(g, cx, cy, 30, 10, '#ffffffcc'); ell(g, cx + 14, cy - 6, 18, 10, '#ffffffcc'); }
    // hills
    g.fillStyle = '#5ea653'; g.beginPath(); g.moveTo(0, 140); for (let x = 0; x <= MW; x += 20) g.lineTo(x, 128 + Math.sin(x * 0.02) * 10); g.lineTo(MW, MH); g.lineTo(0, MH); g.fill();
    g.fillStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < 6; i++) g.fillRect(0, 150 + i * 16, MW, 8);
    // parade of minis walking across
    const items = [];
    parade.forEach((k, i) => {
      const x = ((i * 62 + t * 45) % (parade.length * 62)) - 40, wt = t * 9 + i;
      items.push({ k, x, y: 210 - Math.abs(Math.sin(wt)) * 5, s: 20, f: 'w' + (Math.floor(wt / (Math.PI * 2) * 8) % 8), flip: 1, gy: 210 });
    });
    // heroes showing off in the middle
    Object.keys(HEROES).forEach((k, i, arr) => {
      const ph = (t * 0.9 + i * 0.37) % 1.8;
      const f = ph < 0.18 ? 'a1' : ph < 0.4 ? 'a2' : 'i';
      const gy = 150 + (i % 2) * 14;
      items.push({ k, x: 50 + i * (340 / (arr.length - 1)), y: gy - (ph < 0.18 ? 4 : 0), s: 22, f, flip: i >= arr.length / 2 ? -1 : 1, gy });
    });
    items.sort((a, b) => a.gy - b.gy);
    for (const it of items) { groundMark(g, it.x, it.gy, it.s, null); drawSprite(g, it.k, it.x, it.y, it.s, { frame: it.f, flip: it.flip }); }
    menuAnim = requestAnimationFrame(loop);
  };
  menuAnim = requestAnimationFrame(loop);
}
function panelShell(title) {
  stopMenuAnim();
  const ov = $('overlay'); ov.innerHTML = '';
  const p = document.createElement('div'); p.className = 'panel';
  const back = document.createElement('button'); back.textContent = '← Back'; back.onclick = showMenu;

}
function showHowTo() {
  const p = panelShell('How to Play');
  p.insertAdjacentHTML('beforeend', `<div class="help">
  <b>1. Pick a hero.</b> Your hero fights every round. Each attack fills its <b style="color:#ffe14d">energy bar</b>, and a full bar fires its <b>Super</b>. Heroes unlock <b>Promotions</b> (extra powers) in rounds 3, 5 and 7.<br>
  <b>2. Shop.</b> Each round you get gold. The shop only offers minis from your deck (build decks from the main menu). Tap a card to buy that mini. Refresh the shop for 1 gold.<br>
  <b>3. Level up.</b> Buy a mini you already own to upgrade it, up to ★★★.<br>
  <b>4. Place your team.</b> Bought minis go straight onto your 4×4 board. Drag them to move or swap. Tanks and fighters go in the <b>front</b> rows. Ranged minis and healers go in the <b>back</b> rows. If the board is full, sell a mini to make room. You can field more minis each round (3 → 6).<br>

function showRoster() {

function closeModal() { $('modal').classList.add('hidden'); $('modal').innerHTML = ''; }
function askQuit() {
  if (!S || S.phase === 'menu' || !$('overlay').classList.contains('hidden')) return;
  if (!S.online) S.paused = true;
  const md = $('modal');
  md.innerHTML = S.online ? `<div class="mbox"><h2>Leave match?</h2><p>The game keeps running. Leaving ends the match for both of you.</p>
    <div class="row"><button id="qKeep" class="go">Keep playing</button><button id="qQuit">Leave match</button></div></div>` : `<div class="mbox"><h2>Paused</h2><p>Quit to the main menu? You'll lose your progress in this game.</p>
    <div class="row"><button id="qKeep" class="go">Keep playing</button><button id="qQuit">Quit to menu</button></div></div>`;
  md.classList.remove('hidden');
  $('qKeep').onclick = () => { closeModal(); S.paused = false; last = performance.now(); };
  $('qQuit').onclick = () => { closeModal(); netClose(); showMenu(); };
}
$('menuBtn').onclick = askQuit;
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('modal').classList.contains('hidden')) { closeModal(); if (S) { S.paused = false; last = performance.now(); } }
  else askQuit();
});

// ======================= CUTE BACKDROP =======================
(function backdrop() {
  const bc = document.getElementById('bg'), g = bc.getContext('2d');
  let BW = 0, BH = 0;
  const resize = () => { const d = Math.min(2, window.devicePixelRatio || 1); BW = innerWidth; BH = innerHeight; bc.width = BW * d; bc.height = BH * d; g.setTransform(d, 0, 0, d, 0, 0); };
  addEventListener('resize', resize); resize();
  const clouds = Array.from({ length: 8 }, (_, i) => ({ x: Math.random() * 1.2, y: 0.05 + Math.random() * 0.5, s: 0.6 + Math.random() * 0.9, v: 0.006 + Math.random() * 0.012 }));
  const sparkles = Array.from({ length: 36 }, () => ({ x: Math.random(), y: Math.random(), r: 2 + Math.random() * 4, ph: Math.random() * 6, v: 0.004 + Math.random() * 0.01, k: Math.random() < 0.35 ? 'heart' : 'star', c: ['#fff', '#ffe68a', '#ffb3d6', '#bfe8ff'][Math.floor(Math.random() * 4)] }));
  const walkers = ['nibs', 'lulu', 'fox', 'sprite', 'scorch', 'owl', 'beetle', 'shroom'];
  const flowers = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), c: ['#ff8fc8', '#fff', '#ffe14d', '#c9a6ff'][Math.floor(Math.random() * 4)] }));
  function cloud(x, y, s) {
    g.fillStyle = 'rgba(255,255,255,.92)';
    for (const [dx, dy, r] of [[0, 0, 26], [28, -10, 30], [58, 0, 24], [30, 10, 26], [-22, 8, 18], [80, 10, 16]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = 'rgba(255,190,220,.25)'; g.beginPath(); g.ellipse(x + 30 * s, y + 22 * s, 60 * s, 8 * s, 0, 0, Math.PI * 2); g.fill();
  }
  function heart(x, y, r, c) {
    g.fillStyle = c; g.beginPath(); g.moveTo(x, y + r * 0.9);
    g.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.4);
    g.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); g.fill();
  }
  let last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (now - last < 33) return; // ~30fps is plenty for a backdrop
    last = now;
    const t = now / 1000;
    const sky = g.createLinearGradient(0, 0, 0, BH);
    sky.addColorStop(0, '#9fd8ff'); sky.addColorStop(0.5, '#ffd9ec'); sky.addColorStop(1, '#fff0d4');
    g.fillStyle = sky; g.fillRect(0, 0, BW, BH);
    // soft sun
    const sx = BW * 0.85, sy = BH * 0.12;
    const sun = g.createRadialGradient(sx, sy, 10, sx, sy, 120); sun.addColorStop(0, 'rgba(255,250,200,.95)'); sun.addColorStop(0.35, 'rgba(255,240,170,.5)'); sun.addColorStop(1, 'rgba(255,240,170,0)');
    g.fillStyle = sun; g.fillRect(sx - 130, sy - 130, 260, 260);
    // rainbow arc
    g.save(); g.globalAlpha = 0.18; g.lineWidth = 14;
    ['#ff7a9a', '#ffb347', '#ffe14d', '#7ee081', '#7fc8ff', '#b48cff'].forEach((c, i) => { g.strokeStyle = c; g.beginPath(); g.arc(BW * 0.2, BH * 0.62, BW * 0.42 - i * 14, Math.PI, Math.PI * 1.65); g.stroke(); });
    g.restore();
    // clouds
    for (const c of clouds) { c.x += c.v / 30; if (c.x > 1.15) { c.x = -0.25; c.y = 0.05 + Math.random() * 0.5; } cloud(c.x * BW, c.y * BH, c.s); }
    // sparkles & hearts drift upward and twinkle
    for (const p of sparkles) {
      p.y -= p.v / 30; if (p.y < -0.05) { p.y = 1.05; p.x = Math.random(); }
      const a = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2 + p.ph));
      g.globalAlpha = a;
      const x = p.x * BW + Math.sin(t + p.ph) * 10, y = p.y * BH;
      if (p.k === 'heart') heart(x, y, p.r, p.c); else star(g, x, y, p.r, p.c);
    }
    g.globalAlpha = 1;
    // rolling hills with flowers
    const hill = (base, amp, freq, col, off) => {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, BH);
      for (let x = 0; x <= BW + 20; x += 20) g.lineTo(x, base + Math.sin(x * freq + off) * amp);
      g.lineTo(BW, BH); g.closePath(); g.fill();
    };
    hill(BH * 0.86, 18, 0.006, '#b8ecb0', 0.5);
    hill(BH * 0.92, 12, 0.01, '#9bdc8f', 2);
    for (const f of flowers) {
      const x = f.x * BW, y = BH * 0.9 + f.y * BH * 0.1 + 6;
      for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5 + t * 0.3; g.fillStyle = f.c; g.beginPath(); g.arc(x + Math.cos(a) * 3, y + Math.sin(a) * 3, 2.4, 0, Math.PI * 2); g.fill(); }
      g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(x, y, 1.8, 0, Math.PI * 2); g.fill();
    }
    // a few minis strolling along the hills
    walkers.forEach((k, i) => {
      const speed = 28 + (i % 3) * 8, span = BW + 120;
      const x = ((i * span / walkers.length + t * speed) % span) - 60;
      const gy = BH * 0.93 + Math.sin(x * 0.01 + 2) * 12 - 4;
      const wt = t * 9 + i, s = 14;
      g.fillStyle = 'rgba(0,0,0,.12)'; g.beginPath(); g.ellipse(x, gy + s * 0.9, s * 0.8, s * 0.25, 0, 0, Math.PI * 2); g.fill();
      drawSprite(g, k, x, gy - Math.abs(Math.sin(wt)) * 3, s, { frame: 'w' + (Math.floor(wt / (Math.PI * 2) * 8) % 8) });
    });
  }
  requestAnimationFrame(loop);
})();
